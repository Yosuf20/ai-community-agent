<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AI Community Agent — Live Demo</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115; color: #e6e6e6; margin: 0; padding: 2rem;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.2rem; }
  .sub { color: #9098a8; margin-bottom: 1.5rem; font-size: 0.9rem; }
  .row { display: flex; gap: 0.6rem; margin-bottom: 1.5rem; }
  input {
    flex: 1; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid #2a2e38;
    background: #1a1d24; color: #e6e6e6; font-size: 0.95rem;
  }
  button {
    padding: 0.8rem 1.4rem; border-radius: 8px; border: none;
    background: #4f7cff; color: white; font-weight: 600; cursor: pointer;
  }
  button:disabled { background: #3a3f4b; cursor: not-allowed; }
  .trace { display: flex; flex-direction: column; gap: 0.6rem; }
  .step {
    padding: 0.9rem 1.1rem; border-radius: 10px; border: 1px solid #23262e;
    background: #161920; animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .tag {
    display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
    padding: 0.15rem 0.5rem; border-radius: 5px; margin-bottom: 0.4rem; text-transform: uppercase;
  }
  .tag.user_request { background: #2a2e38; color: #9098a8; }
  .tag.reasoning { background: #3a2e5c; color: #c9b8ff; }
  .tag.tool_selected { background: #2e4a3a; color: #8fe0b0; }
  .tag.tool_result { background: #2e3a4a; color: #8fc0ff; }
  pre {
    white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 0.85rem;
    background: #0d0f13; padding: 0.6rem; border-radius: 6px; color: #c8ccd6;
  }
  .final {
    margin-top: 1.5rem; padding: 1.1rem; border-radius: 10px;
    background: #12251c; border: 1px solid #1d4a30; color: #b7f0cf;
  }
</style>
</head>
<body>
  <h1>🤖 AI Community Agent</h1>
  <div class="sub">Track 3 — powered by LangGraph + Swytchcode APIs (Telegram · Slack · Notion · Resend)</div>

  <div class="row">
    <input id="prompt" type="text"
      value="Check the latest Telegram messages, log any real issues in Notion, and notify the team on Slack if anything is urgent." />
    <button id="runBtn" onclick="runAgent()">Run Agent</button>
  </div>

  <div class="trace" id="trace"></div>
  <div id="finalBox"></div>

<script>
async function runAgent() {
  const btn = document.getElementById('runBtn');
  const traceEl = document.getElementById('trace');
  const finalEl = document.getElementById('finalBox');
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) return;

  btn.disabled = true;
  btn.textContent = 'Running…';
  traceEl.innerHTML = '';
  finalEl.innerHTML = '';

  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });
    const data = await res.json();

    for (const step of data.trace) {
      const div = document.createElement('div');
      div.className = 'step';
      const tag = document.createElement('div');
      tag.className = 'tag ' + step.type;
      tag.textContent = step.type.replace('_', ' ');
      div.appendChild(tag);

      const pre = document.createElement('pre');
      if (step.type === 'user_request') pre.textContent = step.content;
      else if (step.type === 'reasoning') pre.textContent = step.content;
      else if (step.type === 'tool_selected') pre.textContent = step.tool + '(' + JSON.stringify(step.input) + ')';
      else if (step.type === 'tool_result') pre.textContent = step.tool + ' → ' + JSON.stringify(step.result, null, 2);
      div.appendChild(pre);
      traceEl.appendChild(div);
    }

    if (data.final_response) {
      finalEl.innerHTML = `<div class="final"><strong>✅ Final response:</strong><br>${data.final_response}</div>`;
    }
  } catch (e) {
    finalEl.innerHTML = `<div class="final" style="background:#3a1a1a;border-color:#5a2a2a;color:#ffb0b0;">Error: ${e}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Run Agent';
  }
}
</script>
</body>
</html>
