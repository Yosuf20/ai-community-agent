<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Community Agent — Bauhaus Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #F0F0F0;
      --black: #121212;
      --white: #FFFFFF;
      --red: #D02020;
      --blue: #1040C0;
      --yellow: #F0C020;
    }
    
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-canvas);
      color: var(--black);
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 3rem 1.5rem;
      /* Bauhaus Dot Grid Pattern */
      background-image: radial-gradient(var(--black) 2px, transparent 2px);
      background-size: 20px 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    /* HEADER */
    .header {
      background: var(--blue);
      border: 4px solid var(--black);
      box-shadow: 8px 8px 0px 0px var(--black);
      padding: 3rem 2rem;
      position: relative;
      overflow: hidden;
    }
    
    .header-content {
      position: relative;
      z-index: 2;
    }

    .header h1 {
      font-size: clamp(3rem, 8vw, 5rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.05em;
      line-height: 0.9;
      margin: 0 0 1rem 0;
      color: var(--white);
    }

    .header p {
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0;
      color: var(--yellow);
      border: 2px solid var(--black);
      background: var(--black);
      display: inline-block;
      padding: 0.4rem 1rem;
    }

    /* Decorative Geometric Compositions */
    .dec-circle {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 9999px;
      background: var(--red);
      border: 4px solid var(--black);
      right: -30px;
      top: -50px;
      z-index: 1;
    }
    .dec-square {
      position: absolute;
      width: 120px;
      height: 120px;
      background: var(--yellow);
      border: 4px solid var(--black);
      right: 100px;
      bottom: -30px;
      transform: rotate(45deg);
      z-index: 1;
    }
    .dec-triangle {
      position: absolute;
      width: 80px;
      height: 80px;
      background: var(--white);
      border: 4px solid var(--black);
      left: -20px;
      bottom: 20px;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      z-index: 1;
    }

    /* INPUT SECTION */
    .input-section {
      background: var(--white);
      border: 4px solid var(--black);
      box-shadow: 8px 8px 0px 0px var(--black);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    
    @media (min-width: 640px) {
      .input-section {
        flex-direction: row;
      }
    }

    input {
      flex: 1;
      background: var(--bg-canvas);
      border: 4px solid var(--black);
      border-radius: 0;
      padding: 1.2rem 1.5rem;
      font-size: 1.2rem;
      font-weight: 500;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease-out;
    }
    
    input:focus {
      background: var(--white);
      box-shadow: inset 4px 4px 0px 0px rgba(0,0,0,0.1);
    }

    button {
      background: var(--red);
      color: var(--white);
      border: 4px solid var(--black);
      border-radius: 0;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      box-shadow: 6px 6px 0px 0px var(--black);
      transition: all 0.15s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:hover:not(:disabled) {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px 0px var(--black);
    }

    button:active:not(:disabled) {
      transform: translate(6px, 6px);
      box-shadow: 0px 0px 0px 0px var(--black);
    }

    button:disabled {
      background: var(--muted);
      color: #888;
      cursor: not-allowed;
      box-shadow: 4px 4px 0px 0px var(--black);
      transform: none;
    }

    /* TRACE LOG */
    .trace {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .step {
      background: var(--white);
      border: 4px solid var(--black);
      box-shadow: 8px 8px 0px 0px var(--black);
      padding: 2rem;
      position: relative;
    }

    /* Geometric corner decorations */
    .step::before {
      content: "";
      position: absolute;
      top: -4px;
      right: -4px;
      width: 24px;
      height: 24px;
      border: 4px solid var(--black);
      background: var(--yellow);
      z-index: 2;
    }
    .step:nth-child(2n)::before {
      background: var(--blue);
      border-radius: 9999px;
    }
    .step:nth-child(3n)::before {
      background: var(--red);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      border: none;
    }

    .tag {
      display: inline-block;
      font-size: 0.9rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.4rem 1rem;
      border: 2px solid var(--black);
      margin-bottom: 1.5rem;
      box-shadow: 4px 4px 0px 0px var(--black);
    }

    .tag.user_request { background: var(--blue); color: var(--white); }
    .tag.reasoning { background: var(--yellow); color: var(--black); }
    .tag.tool_selected { background: var(--red); color: var(--white); }
    .tag.tool_result { background: var(--white); color: var(--black); }

    pre {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      line-height: 1.5;
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--bg-canvas);
      border: 4px solid var(--black);
      padding: 1.5rem;
      color: var(--black);
      font-weight: 700;
    }

    /* FINAL RESPONSE */
    .final {
      background: var(--yellow);
      border: 4px solid var(--black);
      box-shadow: 8px 8px 0px 0px var(--black);
      padding: 2.5rem;
      margin-top: 1rem;
      position: relative;
    }

    .final strong {
      display: block;
      font-size: 2rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      border-bottom: 4px solid var(--black);
      padding-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 4px solid var(--black);
      background: var(--white);
      margin-right: 12px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="dec-circle"></div>
      <div class="dec-square"></div>
      <div class="dec-triangle"></div>
      
      <div class="header-content">
        <h1>AI Community<br>Agent</h1>
        <p>LangGraph · Slack · Telegram</p>
      </div>
    </header>

    <div class="input-section">
      <input id="prompt" type="text"
        placeholder="Enter your instruction here..."
        value="Read the recent Telegram messages, respond as a moderator, and log any important issues or tasks in Notion." />
      <button id="runBtn" onclick="runAgent()">
        <span id="btnText">Execute</span>
      </button>
    </div>

    <div class="trace" id="trace"></div>
    <div id="finalBox"></div>
  </div>

<script>
async function runAgent() {
  const btn = document.getElementById('runBtn');
  const btnText = document.getElementById('btnText');
  const traceEl = document.getElementById('trace');
  const finalEl = document.getElementById('finalBox');
  const prompt = document.getElementById('prompt').value.trim();
  
  if (!prompt) {
    document.getElementById('prompt').focus();
    return;
  }

  btn.disabled = true;
  btnText.innerHTML = '<div class="spinner"></div> Running';
  
  traceEl.innerHTML = '';
  finalEl.innerHTML = '';

  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });
    
    if (!res.ok) {
      throw new Error(`Server responded with status ${res.status}`);
    }
    
    const data = await res.json();

    if (data.trace && Array.isArray(data.trace)) {
      data.trace.forEach((step, index) => {
        const div = document.createElement('div');
        div.className = 'step';
        
        const tag = document.createElement('div');
        tag.className = 'tag ' + step.type;
        tag.textContent = step.type.replace('_', ' ');
        div.appendChild(tag);

        const pre = document.createElement('pre');
        if (step.type === 'user_request') {
          pre.textContent = step.content;
        } else if (step.type === 'reasoning') {
          pre.textContent = step.content;
        } else if (step.type === 'tool_selected') {
          pre.textContent = step.tool + '(' + JSON.stringify(step.input, null, 2) + ')';
        } else if (step.type === 'tool_result') {
          pre.textContent = step.tool + ' → ' + JSON.stringify(step.result, null, 2);
        } else {
          pre.textContent = JSON.stringify(step, null, 2);
        }
        
        div.appendChild(pre);
        traceEl.appendChild(div);
      });
      
      if (data.final_response) {
        finalEl.innerHTML = `<div class="final"><strong>Final Output</strong>${data.final_response}</div>`;
      }
      
    } else if (data.final_response) {
       finalEl.innerHTML = `<div class="final"><strong>Final Output</strong>${data.final_response}</div>`;
    }
    
  } catch (e) {
    finalEl.innerHTML = `<div class="final" style="background: var(--red); color: var(--white);">
      <strong style="color: var(--white); border-color: var(--white);">System Error</strong>${e.message}
    </div>`;
  } finally {
    btn.disabled = false;
    btnText.innerHTML = 'Execute';
  }
}

document.getElementById('prompt').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') {
    runAgent();
  }
});
</script>
</body>
</html>
